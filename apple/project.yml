# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). The .xcodeproj is generated and git-ignored:
#   apple/scripts/build-shared.sh && (cd apple && xcodegen generate)
name: TwitchPlayerApple
options:
  bundleIdPrefix: com.twitchplayer
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    tvOS: "18.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # arm64 only (AGENTS.md): the XCFramework has no x86_64 slice, and without this the simulator builds an x86_64 variant too.
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # No team, no provisioning: simulator and local runs only (see docs/APPLE_PLAN.md). Ad-hoc signing gives the app the
    # entitlements the Keychain needs on the simulator.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages: {}
targetTemplates:
  Smoke:
    type: application
    sources:
      - path: SmokeApp
    dependencies:
      - framework: Frameworks/TwitchShared.xcframework
        embed: false
        link: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_TwitchClientId: "$(TWITCH_CLIENT_ID)"
targets:
  SmokeIOS:
    templates: [Smoke]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twitchplayer.smoke
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
  SmokeMac:
    templates: [Smoke]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twitchplayer.smoke
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
  SmokeTV:
    templates: [Smoke]
    platform: tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twitchplayer.smoke
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  TwitchIOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: Resources
        excludes: ["*.json"]
    dependencies:
      - framework: Frameworks/TwitchShared.xcframework
        embed: false
        link: true
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: TwitchPlayer
        TwitchClientId: "$(TWITCH_CLIENT_ID)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleLocalizations: [en, fr, ar, de, es, it, pt, ja, ko, zh-Hans, zh-Hant, ru, tr, pl, nl, sv, da, fi, nb, cs, sk, hu, ro, bg, el, hr, uk, vi, th, id, ms, he, hi, ca, fil, pt-PT]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twitchplayer.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_STRICT_CONCURRENCY: targeted
    # The offline demo (`-demo` launch argument) plays the bundled test clip. It is copied into Debug builds only, so a release app has neither
    # the clip nor the launch argument (`LaunchMode` is `#if DEBUG`).
    postCompileScripts:
      - name: Copy demo clip (Debug only)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            cp "$SRCROOT/../demo-android/src/main/assets/demo_stream.mp4" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/demo_stream.mp4"
          fi
  TwitchIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TwitchIOS
      - framework: Frameworks/TwitchShared.xcframework
        embed: false
        link: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.twitchplayer.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TwitchIOS.app/TwitchIOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TwitchMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Shared
      - path: Resources
        excludes: ["*.json"]
    dependencies:
      - framework: Frameworks/TwitchShared.xcframework
        embed: false
        link: true
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: TwitchPlayer
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: "15.0"
        TwitchClientId: "$(TWITCH_CLIENT_ID)"
        CFBundleLocalizations: [en, fr, ar, de, es, it, pt, ja, ko, zh-Hans, zh-Hant, ru, tr, pl, nl, sv, da, fi, nb, cs, sk, hu, ro, bg, el, hr, uk, vi, th, id, ms, he, hi, ca, fil, pt-PT]
    entitlements:
      path: Mac/TwitchMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twitchplayer.mac
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_STRICT_CONCURRENCY: targeted
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    postCompileScripts:
      - name: Copy demo clip (Debug only)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            cp "$SRCROOT/../demo-android/src/main/assets/demo_stream.mp4" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/demo_stream.mp4"
          fi
  TwitchMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TwitchMac
      - framework: Frameworks/TwitchShared.xcframework
        embed: false
        link: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.twitchplayer.mac.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TwitchMac.app/Contents/MacOS/TwitchMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TwitchTV:
    type: application
    platform: tvOS
    sources:
      - path: TV
      - path: Shared
        # Typing, the pasteboard and the emote panel do not exist on the Apple TV (chat is read-only there, sign-in is a QR code).
        excludes: ["Views/SignInSheet.swift", "Views/ChatComposer.swift"]
      - path: Resources
        excludes: ["*.json"]
    dependencies:
      - framework: Frameworks/TwitchShared.xcframework
        embed: false
        link: true
    info:
      path: TV/Info.plist
      properties:
        CFBundleDisplayName: TwitchPlayer
        TwitchClientId: "$(TWITCH_CLIENT_ID)"
        UILaunchScreen: {}
        CFBundleLocalizations: [en, fr, ar, de, es, it, pt, ja, ko, zh-Hans, zh-Hant, ru, tr, pl, nl, sv, da, fi, nb, cs, sk, hu, ro, bg, el, hr, uk, vi, th, id, ms, he, hi, ca, fil, pt-PT]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twitchplayer.tv
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    postCompileScripts:
      - name: Copy demo clip (Debug only)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            cp "$SRCROOT/../demo-android/src/main/assets/demo_stream.mp4" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/demo_stream.mp4"
          fi
  TwitchTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests
    dependencies:
      - target: TwitchTV
      - framework: Frameworks/TwitchShared.xcframework
        embed: false
        link: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.twitchplayer.tv.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TwitchTV.app/TwitchTV"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TwitchIOS:
    build:
      targets:
        TwitchIOS: all
    test:
      config: Debug
      targets: [TwitchIOSTests]
      # Order independence is checked on every run: tests share one Kotlin graph (DataStore allows one instance per file), so none may rely on another.
      randomExecutionOrder: true
      # The tests run inside the app: it must start on the offline demo data, not on the network.
      commandLineArguments:
        "-demo": true
    run:
      config: Debug
    archive:
      config: Release
  SmokeIOS:
    build:
      targets:
        SmokeIOS: all
    run:
      config: Debug
  SmokeMac:
    build:
      targets:
        SmokeMac: all
  SmokeTV:
    build:
      targets:
        SmokeTV: all
  TwitchMac:
    build:
      targets:
        TwitchMac: all
    test:
      config: Debug
      targets: [TwitchMacTests]
      randomExecutionOrder: true
      commandLineArguments:
        "-demo": true
    run:
      config: Debug
    archive:
      config: Release
  TwitchTV:
    build:
      targets:
        TwitchTV: all
    test:
      config: Debug
      targets: [TwitchTVTests]
      randomExecutionOrder: true
      commandLineArguments:
        "-demo": true
    run:
      config: Debug
    archive:
      config: Release
