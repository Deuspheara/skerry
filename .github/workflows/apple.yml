name: Apple

# The Kotlin/Native side and the Swift smoke apps. Runs on macOS only; the Android CI (ci.yml) is untouched. The runner's Xcode must
# have the SDKs this project builds with (see docs/APPLE_PLAN.md: the local machine uses an Xcode beta, hosted runners ship stable
# Xcode, so pin the Xcode version below once the minimum stable release is chosen).

on:
  pull_request:
    paths:
      - "shared/**"
      - "apple/**"
      - "build-logic/**"
      - "gradle/**"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  shared-native:
    name: shared (macOS host + iOS simulator tests)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Native tests
        run: ./gradlew macosArm64Test iosSimulatorArm64Test --continue
      - name: Build the XCFramework and the smoke apps
        run: |
          brew install xcodegen
          apple/scripts/build-shared.sh debug
          (cd apple && xcodegen generate)
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme SmokeIOS -destination 'generic/platform=iOS Simulator' build
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme SmokeMac -destination 'platform=macOS' build
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme SmokeTV -destination 'generic/platform=tvOS Simulator' build
      - name: iOS app (strings, build, tests)
        run: |
          python3 apple/scripts/sync-strings.py --check
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme TwitchIOS -configuration Release -destination 'generic/platform=iOS Simulator' build
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme TwitchIOS -destination 'platform=iOS Simulator,name=iPhone 16' test
      - name: macOS app (build, tests)
        run: |
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme TwitchMac -configuration Release -destination 'platform=macOS' build
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme TwitchMac -destination 'platform=macOS' test
      - name: Apple TV app (build, tests)
        run: |
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme TwitchTV -configuration Release -destination 'generic/platform=tvOS Simulator' build
          # The tests need a tvOS simulator runtime; hosted runners have one for their Xcode.
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme TwitchTV -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' test
