name: Apple

# The Kotlin/Native side and the three SwiftUI apps, one job per platform (the Android CI, ci.yml, is untouched).
#
# Toolchain: the apps were developed on Xcode 27.0 beta 4 (iOS/macOS/tvOS 26.5 and 27 SDKs). A hosted runner ships stable Xcode only, so the jobs
# build with the Xcode named in DEVELOPER_DIR below (the newest stable one with the 26 SDKs; Liquid Glass needs them) and a step fails with a
# clear message when the runner image does not have it: bump XCODE_APP together with the runner image (runs-on) when GitHub rotates them.
# This workflow has not been run on GitHub yet (see docs/APPLE_PLAN.md, "Not verified").

on:
  pull_request:
    paths:
      - "shared/**"
      - "apple/**"
      - "build-logic/**"
      - "gradle/**"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
  XCODE_APP: /Applications/Xcode_26.4.app
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  shared-native:
    name: shared (macOS host, iOS and tvOS simulator tests)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: |
          test -d "$XCODE_APP" || { echo "::error::$XCODE_APP is not on this runner image: update XCODE_APP and runs-on in apple.yml"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Cache Kotlin/Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Native tests
        run: ./gradlew macosArm64Test iosSimulatorArm64Test tvosSimulatorArm64Test -PtvosSimulatorTests=true --continue

  ios:
    name: iOS app (build, tests)
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: |
          test -d "$XCODE_APP" || { echo "::error::$XCODE_APP is not on this runner image: update XCODE_APP and runs-on in apple.yml"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Cache Kotlin/Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Install XcodeGen (pinned release, checked)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-release
          echo "/tmp/xcodegen-release/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build the XCFramework and the project
        run: |
          python3 apple/scripts/sync-strings.py --check
          apple/scripts/build-shared.sh debug
          (cd apple && xcodegen generate)
      - name: Release configuration builds against the release framework (no demo code)
        run: |
          apple/scripts/build-shared.sh release
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme TwitchIOS -configuration Release -destination 'generic/platform=iOS Simulator' build
          apple/scripts/build-shared.sh debug
      - name: Tests on an iPhone simulator
        run: |
          mkdir -p build/results
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme TwitchIOS -destination 'platform=iOS Simulator,name=iPhone 17' -resultBundlePath build/results/ios.xcresult test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: build/results/ios.xcresult
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: macOS app (build, tests)
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: |
          test -d "$XCODE_APP" || { echo "::error::$XCODE_APP is not on this runner image: update XCODE_APP and runs-on in apple.yml"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Cache Kotlin/Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Install XcodeGen (pinned release, checked)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-release
          echo "/tmp/xcodegen-release/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build the XCFramework and the project
        run: |
          python3 apple/scripts/sync-strings.py --check
          apple/scripts/build-shared.sh debug
          (cd apple && xcodegen generate)
      - name: Tests
        run: |
          mkdir -p build/results
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme TwitchMac -destination 'platform=macOS' -resultBundlePath build/results/macos.xcresult test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-test-results
          path: build/results/macos.xcresult
          if-no-files-found: ignore
          retention-days: 14

  tvos:
    name: Apple TV app (build, tests)
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: |
          test -d "$XCODE_APP" || { echo "::error::$XCODE_APP is not on this runner image: update XCODE_APP and runs-on in apple.yml"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Cache Kotlin/Native
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Install XcodeGen (pinned release, checked)
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  /tmp/xcodegen.zip" | shasum -a 256 -c -
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-release
          echo "/tmp/xcodegen-release/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build the XCFramework and the project
        run: |
          python3 apple/scripts/sync-strings.py --check
          apple/scripts/build-shared.sh debug
          (cd apple && xcodegen generate)
      - name: Tests on an Apple TV simulator
        run: |
          mkdir -p build/results
          # The tvOS simulator runtime is installed with the Xcode of the runner image; the destination is the device name of that runtime.
          xcodebuild -project apple/TwitchPlayerApple.xcodeproj -scheme TwitchTV -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' -resultBundlePath build/results/tvos.xcresult test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tvos-test-results
          path: build/results/tvos.xcresult
          if-no-files-found: ignore
          retention-days: 14
