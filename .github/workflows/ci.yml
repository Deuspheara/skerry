name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-submit
      - name: Format, detekt (type-resolved) and Android Lint
        run: >
          ./gradlew spotlessCheck verifyCommonMain detekt detektDebug detektDebugUnitTest detektRelease
          detektMainJvm detektMainAndroid detektTestJvm lint :app:compileDebugAndroidTestKotlin :phone:compileDebugAndroidTestKotlin :benchmark-phone:compileNonMinifiedKotlin
          --continue --console=plain
      - name: Upload detekt SARIF
        if: ${{ !cancelled() && hashFiles('app/build/reports/detekt/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: app/build/reports/detekt
          category: detekt
        continue-on-error: true # code scanning needs GitHub Advanced Security on private repositories
      - name: Upload detekt SARIF (shared:core)
        if: ${{ !cancelled() && hashFiles('shared/core/build/reports/detekt/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: shared/core/build/reports/detekt
          category: detekt-shared-core
        continue-on-error: true
      - name: Upload detekt SARIF (shared:stream)
        if: ${{ !cancelled() && hashFiles('shared/stream/build/reports/detekt/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: shared/stream/build/reports/detekt
          category: detekt-shared-stream
        continue-on-error: true
      - name: Upload detekt SARIF (shared:chat)
        if: ${{ !cancelled() && hashFiles('shared/chat/build/reports/detekt/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: shared/chat/build/reports/detekt
          category: detekt-shared-chat
        continue-on-error: true
      - name: Upload detekt SARIF (shared:player-api)
        if: ${{ !cancelled() && hashFiles('shared/player-api/build/reports/detekt/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: shared/player-api/build/reports/detekt
          category: detekt-shared-player-api
        continue-on-error: true
      - name: Upload detekt SARIF (shared:testing)
        if: ${{ !cancelled() && hashFiles('shared/testing/build/reports/detekt/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: shared/testing/build/reports/detekt
          category: detekt-shared-testing
        continue-on-error: true
      - name: Upload detekt SARIF (shared:presenters)
        if: ${{ !cancelled() && hashFiles('shared/presenters/build/reports/detekt/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: shared/presenters/build/reports/detekt
          category: detekt-shared-presenters
        continue-on-error: true
      - name: Upload detekt SARIF (phone)
        if: ${{ !cancelled() && hashFiles('phone/build/reports/detekt/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: phone/build/reports/detekt
          category: detekt-phone
        continue-on-error: true
      - name: Upload Lint SARIF
        if: ${{ !cancelled() && hashFiles('app/build/reports/lint-results-debug.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint
        continue-on-error: true
      - name: Upload Lint SARIF (phone)
        if: ${{ !cancelled() && hashFiles('phone/build/reports/lint-results-debug.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: phone/build/reports/lint-results-debug.sarif
          category: android-lint-phone
        continue-on-error: true
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
            **/build/reports/spotless/
          retention-days: 7

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-hygiene:
    name: commit hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No co-author trailers or AI attribution in commit messages
        run: |
          range="origin/${{ github.base_ref }}..HEAD"
          if git log --format=%B "$range" | grep -iE '^co-authored-by:|generated with|🤖'; then
            echo "Remove the attribution lines from the commit messages (see AGENTS.md)"; exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Unit tests (app, platform, shared modules, build-logic)
        run: ./gradlew testDebugUnitTest jvmTest testAndroidHostTest :build-logic:convention:test --continue --console=plain
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  build-release:
    name: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Release APKs and AABs, TV and phone (R8 full mode, unsigned)
        run: ./gradlew :app:assembleRelease :app:bundleRelease :phone:assembleRelease :phone:bundleRelease --console=plain
      - name: Check that the baseline profile is packaged (TV and phone)
        run: |
          for module in app phone; do
            apk=$(ls $module/build/outputs/apk/release/*.apk | head -1)
            aab=$(ls $module/build/outputs/bundle/release/*.aab | head -1)
            unzip -l "$apk" | grep -qE 'assets/dexopt/baseline\.prof$' || { echo "baseline.prof missing from the $module APK"; exit 1; }
            unzip -l "$aab" | grep -qE 'BUNDLE-METADATA/com\.android\.tools\.build\.profiles/baseline\.prof$' || { echo "baseline.prof missing from the $module AAB"; exit 1; }
          done
          echo "baseline profiles packaged in both APKs and AABs"
      - name: Check the phone profile packaging (profileinstaller, startup classes in classes.dex)
        run: python3 -I benchmark/tools/check-profile-packaging.py phone phone
      - name: Check that the release builds contain no demo data
        run: |
          for module in app phone; do
            if grep -q 'com\.twitchplayer\.tv\.demo' "$module/build/outputs/mapping/release/mapping.txt"; then
              echo "demo classes found in the $module release build"; exit 1
            fi
            if unzip -l "$module"/build/outputs/apk/release/*.apk | grep -q demo_stream; then
              echo "demo asset found in the $module release APK"; exit 1
            fi
          done
      - name: Check that the phone APK has no keep rules and the translated strings
        run: |
          # R8 prints the merged configuration: any -keep other than -keepattributes would come from a library, not from us.
          if grep -E '^-keep[^a]' phone/proguard-rules.pro platform-android/consumer-rules.pro shared/*/consumer-rules.pro; then
            echo "keep rules found in our own rule files"; exit 1
          fi
          locales=$(ls -d phone/build/generated/sharedStrings/release/values* | wc -l)
          [ "$locales" -ge 36 ] || { echo "only $locales language folders generated from the TV strings"; exit 1; }
      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          retention-days: 30
      - name: Upload unsigned APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            phone/build/outputs/apk/release/*.apk
          retention-days: 7

  # Later, once Apple targets exist:
  # ios-framework:
  #   runs-on: macos-latest
  #   steps: build the shared XCFramework (linkReleaseFrameworkIosSimulatorArm64) and run iosSimulatorArm64Test
