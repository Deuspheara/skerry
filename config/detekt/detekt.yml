# Layered on top of detekt's defaults (buildUponDefaultConfig = true). Only deviations live here.
# Do not add `@Suppress` for new code; fix it. Existing findings are in each module's detekt-baseline.xml.
style:
  MagicNumber:
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidHostTest/**', '**/demo/**', '**/demoAlways/**', '**/designsystem/**', '**/ui/**', '**/benchmark/**']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreExtensionFunctions: true
  MaxLineLength:
    active: false # ktlint (Spotless) owns formatting
  ReturnCount:
    max: 4
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: false # ktlint owns imports

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    allowedFunctionParameters: 8
    allowedConstructorParameters: 10
    ignoreAnnotatedParameter: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
    ignoreSimpleWhenEntries: true # an event dispatcher (`when` of one-line branches) is one decision, not one per event
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']
    allowedFunctionsPerFile: 20
    allowedFunctionsPerClass: 20

coroutines:
  InjectDispatcher:
    # Tests run on real dispatchers on purpose (DataStore scopes, Ktor mock engines); production code injects its own.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidHostTest/**']
