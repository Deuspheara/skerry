// Compose compiler stability configuration (one pattern per line; * = one segment, ** = any depth).
//
// Classes in :shared:* modules are compiled without the Compose compiler, so the app would treat them as unstable and
// recompose every composable that takes one whenever its parent recomposes. Only plain immutable data holders belong
// here, never services, repositories or anything with mutable state. A type is listed only when it reaches a composable
// parameter. `./gradlew :app:compileDebugKotlin -PcomposeReports` writes app-composables.txt; its unstable parameters
// must stay the same five as before the migration (Context, WebViewVideoPlayer?, RailEdgeGuard?, StreamPreview, Any?),
// none of them a shared type.
//
// Covered, all immutable (val-only data classes, enums and sealed hierarchies over such types):
// every model the screens render (LiveStream, Category, ChannelDetails, Replay, ChatSettings, AppSettings, ...).
com.twitchplayer.tv.core.data.model.*
// The progress shown on replay cards (resume position / watched fraction).
com.twitchplayer.tv.feature.vod.data.VodProgress
// The room modes (slow, followers-only, ...) shown in the chat header and settings.
com.twitchplayer.tv.feature.player.data.chat.RoomState
// The sign-in code shown in the device-code dialog (passed to AppDialogs).
com.twitchplayer.tv.core.network.auth.DeviceCodeResponse
// The resolved replay handed to the VOD screen (its `vod` composable parameter): val-only data over StreamVariant.
com.twitchplayer.tv.feature.player.data.stream.ResolvedVod
// One drawable chat word (name, urls, flags) passed to the emote renderer: val-only data class.
com.twitchplayer.tv.feature.player.data.emotes.Emote
//
// Deliberately NOT listed: SessionState (UI collects it as state and branches on it; no composable takes it as a
// parameter) and TwitchTokens (secrets: never reach the UI layer). The Compose report confirms neither is a parameter.
// Playback statistics overlay, ad countdown and the quality list: val-only data classes in :shared:player-api.
com.twitchplayer.tv.feature.player.playback.PlaybackStats
com.twitchplayer.tv.feature.player.playback.AdBreak
com.twitchplayer.tv.feature.player.playback.VideoQuality
com.twitchplayer.tv.feature.player.playback.VideoQualities
// Screen states built by the presenters in :shared:presenters: val-only data classes over immutable collections
// (ImmutableList) and the models above. Listed one by one on purpose: the presenters in the same packages hold mutable
// state and must never be declared stable.
com.twitchplayer.tv.feature.home.presentation.HomeContent
com.twitchplayer.tv.feature.follows.presentation.FollowsContent
com.twitchplayer.tv.feature.browse.presentation.BrowseUiState
com.twitchplayer.tv.feature.category.presentation.CategoryUiState
com.twitchplayer.tv.feature.category.presentation.CategoryScreenState
com.twitchplayer.tv.feature.search.presentation.SearchUiState
com.twitchplayer.tv.feature.search.presentation.ResultsUi
com.twitchplayer.tv.feature.search.presentation.ResultsUi.Trends
com.twitchplayer.tv.feature.search.presentation.ResultsUi.Found
com.twitchplayer.tv.feature.search.presentation.VoiceState
com.twitchplayer.tv.feature.settings.presentation.SettingsUiState
com.twitchplayer.tv.feature.auth.presentation.SignInUiState
// The load state every network screen is gated by (LoadGate takes it as a parameter); its payload is one of the types above.
com.twitchplayer.tv.core.presentation.Load<*>
// The player screen state built by PlayerPresenter and the chat lines it publishes: val-only data classes over
// ImmutableList and the models above; ChatPiece and ZapRowKind are sealed hierarchies of such classes.
com.twitchplayer.tv.feature.player.presentation.PlayerUiState
com.twitchplayer.tv.feature.player.presentation.ZapRow
com.twitchplayer.tv.feature.player.presentation.ZapRowKind
com.twitchplayer.tv.feature.player.presentation.ZapRowKind.*
com.twitchplayer.tv.feature.player.presentation.ChatLine
com.twitchplayer.tv.feature.player.presentation.ChatPiece
com.twitchplayer.tv.feature.player.presentation.ChatPiece.*
//
// Two reference types are listed on purpose, because composables take them as a parameter (the player screen takes its
// presenter, the app shell takes the channel-key bus), exactly as they took the ViewModel / bus when both lived in the
// app module: PlayerPresenter and ChannelKeyBus have only `val` public properties (StateFlows and one-shot flows) and
// never change identity, so a composable reading them through `collectAsState` is skipped correctly. This is the only
// exception to "never the presenters": every other screen receives plain state, not its presenter.
com.twitchplayer.tv.feature.player.presentation.PlayerPresenter
com.twitchplayer.tv.core.ui.ChannelKeyBus
