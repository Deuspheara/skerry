// Compose compiler stability configuration (one pattern per line; * = one segment, ** = any depth).
//
// Classes in :shared:* modules are compiled without the Compose compiler, so the app would treat them as unstable and
// recompose every composable that takes one whenever its parent recomposes. Only plain immutable data holders belong
// here, never services, repositories or anything with mutable state. A type is listed only when it reaches a composable
// parameter. `./gradlew :app:compileDebugKotlin -PcomposeReports` writes app-composables.txt; its unstable parameters
// must stay the same five as before the migration (Context, WebViewVideoPlayer?, RailEdgeGuard?, StreamPreview, Any?),
// none of them a shared type.
//
// Covered, all immutable (val-only data classes, enums and sealed hierarchies over such types):
// every model the screens render (LiveStream, Category, ChannelDetails, Replay, ChatSettings, AppSettings, ...).
com.twitchplayer.tv.core.data.model.*
// The progress shown on replay cards (resume position / watched fraction).
com.twitchplayer.tv.feature.vod.data.VodProgress
// The room modes (slow, followers-only, ...) shown in the chat header and settings.
com.twitchplayer.tv.feature.player.data.chat.RoomState
// The sign-in code shown in the device-code dialog (passed to AppDialogs).
com.twitchplayer.tv.core.network.auth.DeviceCodeResponse
//
// Deliberately NOT listed: SessionState (UI collects it as state and branches on it; no composable takes it as a
// parameter) and TwitchTokens (secrets: never reach the UI layer). The Compose report confirms neither is a parameter.
